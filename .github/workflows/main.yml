on:
  push:
  pull_request:
    branches: "main"
name: bun test
jobs:
  my-job:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun run test
  lang:
    name: crabrave-lang
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lang
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The content mapper runs under Node with type stripping (22.18+).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: grammar corpus, and grammar.json is up to date
        run: bun run test:grammar && git diff --exit-code grammar/src
      - run: bun run typecheck
      - run: bun run test
